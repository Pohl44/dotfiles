# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Keine Leerzeile zwischen den Prompts
add_newline = false

# Prompt-Symbol: grüner Pfeil bei Erfolg, roter Pfeil nach einem Fehler
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

# Paketversion anzeigen (package.json, Cargo.toml, …)
[package]
disabled = false

# Anzeigen, wenn die Shell in einem Container läuft
[container]
disabled = false

# Kubernetes-Kontext (nur sichtbar, wenn eine kubeconfig existiert)
[kubernetes]
disabled = false
#format = '[$symbol ($context)]($style) [\(ns=$namespace\)](red) in '
#format = '[$symbol ($context)]($style) [\(ns=$namespace\)](red) in [$cluster](blue) in '
format = ' [$symbol$context( \($namespace\))]($style)'
symbol = '⛵'
style = 'blue'

[[kubernetes.contexts]]
context_pattern = "vik8scplt914s"
style = "green"
context_alias = "TimCluster"

[[kubernetes.contexts]]
context_pattern = '^vik8sc(?P<short_context>.*)$'
context_alias = "$short_context"
#user_pattern = "admin"
#style = "bold red"
#user_alias = "admin"

# Benutzer immer vorne anzeigen; Hostname nur per SSH  →  "tim in ~"  bzw.  "tim@server in ~"
[username]
show_always = true
format = "[$user]($style)"

[hostname]
format = "[@$hostname]($style)"

[directory]
format = " in [$path]($style)[$read_only]($read_only_style) "
truncation_symbol = "…/"   # zeigt an, dass vorne Ordner abgeschnitten sind

# Exit-Code nach einem Fehler, z.B. "✗127"
[status]
disabled = false
symbol = "✗"
format = "[$symbol$status]($style) "

# Hinweis, solange sudo ohne Passwort-Abfrage aktiv ist
[sudo]
disabled = false
symbol = "🔓 "
format = "[as $symbol]($style)"

# Shell-Anzeige ("bsh") aus
[shell]
disabled = true

[time]
disabled = true
