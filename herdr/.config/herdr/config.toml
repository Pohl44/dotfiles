onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
# kitty-Tab zeigt nur den Workspace-Namen (Standard wäre "{hostname}: {workspace}")
window_title = "{workspace}"
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

# ══════════════════════════════════════════════════════════════════════════════
#  TASTEN – bewusst schlank. Übersicht: ~/dotfiles/herdr/KEYS.md
#
#  Alltag:  Alt + Taste           (nur die Tasten unten)
#  Selten:  Strg+B, loslassen, Taste   (herdr-Standard, Strg+B ? zeigt alles)
#  Alles andere gehört den Programmen im Bereich.
# ══════════════════════════════════════════════════════════════════════════════
[keys]
focus_pane_left  = ["prefix+h", "alt+h"]
focus_pane_down  = ["prefix+j", "alt+j"]
focus_pane_up    = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
switch_tab       = ["prefix+1..9", "alt+1..9"]
split_vertical   = ["prefix+v", "alt+v"]          # nebeneinander
split_horizontal = ["prefix+minus", "alt+minus"]  # übereinander
zoom             = ["prefix+z", "alt+z"]
copy_mode        = ["prefix+[", "alt+ü"]          # scrollen, suchen, kopieren; q beendet
goto             = ["prefix+g", "alt+g"]          # alle Bereiche und Agenten, / sucht

# lv – Dateimanager (Repo ~/lv)
[[keys.command]]
key = ["prefix+f", "alt+ö"]
type = "popup"
command = "/home/tim/.local/bin/lv --popup"
description = "Dateien (lv)"
width = "94%"
height = "92%"
